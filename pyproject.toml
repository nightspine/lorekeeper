[project]
name = "lorekeeper"
version = "0.0.0"
description = "Reference implementation of the Lorekeeper spoiler-safe book index format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21"]

[project.scripts]
lorekeeper = "lorekeeper.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
claude = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorekeeper"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "lorekeeper/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
