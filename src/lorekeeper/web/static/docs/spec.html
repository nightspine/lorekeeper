<p id="spec-status" role="status">Loading the specification.</p>
<div class="spec-wrap">
<details id="spec-toc" hidden open></details>
<article id="spec" aria-label="Lorekeeper specification"></article>

<script src="../vendor/marked.min.js"></script>
<script>
// Renders the repository's own SPEC.md. It is the one place on this site that uses innerHTML: the
// source is a file shipped with the project (served read-only by the server as /spec.md, or copied
// next to the docs by `lorekeeper docs export`), never index content or any other user data.
(function () {
  var box = document.getElementById("spec");
  var toc = document.getElementById("spec-toc");
  var status = document.getElementById("spec-status");
  function slug(text) {
    return text.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z]+;/g, "").replace(/[^a-z0-9 -]/g, "").trim().replace(/ /g, "-");
  }
  fetch("../spec.md").then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (md) {
    box.innerHTML = marked.parse(md);
    var h1 = box.querySelector("h1");
    if (h1) { var p = document.createElement("p"); p.className = "lede"; p.textContent = h1.textContent; h1.replaceWith(p); }
    // Links to repository files (schema/, conformance/) have no target on a static host: show them as text.
    box.querySelectorAll("a[href]").forEach(function (a) {
      if (/^(#|https?:|mailto:)/.test(a.getAttribute("href"))) return;
      var span = document.createElement("span");
      span.innerHTML = a.innerHTML;
      span.title = "In the repository: " + a.getAttribute("href");
      a.replaceWith(span);
    });
    var seen = {}, items = [];
    box.querySelectorAll("h2, h3").forEach(function (h) {
      var id = slug(h.textContent) || "section", n = seen[id] = (seen[id] || 0) + 1;
      if (n > 1) id += "-" + n;
      h.id = id;
      items.push('<li class="' + h.tagName.toLowerCase() + '"><a href="#' + id + '">' + h.innerHTML.replace(/<\/?a[^>]*>/g, "") + "</a></li>");
    });
    toc.innerHTML = "<summary>Contents</summary><ul>" + items.join("") + "</ul>";
    toc.hidden = false;
    status.hidden = true;
    if (location.hash) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
  }).catch(function (e) {
    status.textContent = "Could not load the specification (" + e.message + "). It is served as spec.md next to this site; if you copied the docs folder by hand, copy SPEC.md as spec.md too.";
  });
})();
</script>
